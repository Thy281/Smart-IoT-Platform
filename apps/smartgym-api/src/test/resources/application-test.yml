spring:
  datasource:
    url: jdbc:tc:postgresql:16:///smartgym_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:

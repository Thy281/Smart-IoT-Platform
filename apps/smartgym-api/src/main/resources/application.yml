spring:
  application:
    name: smartgym-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartgym}
    username: ${DB_USER:smartgym}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${API_PORT:8080}
  error:
    include-message: always

security:
  jwt:
    secret: ${JWT_SECRET:must-be-at-least-32-chars-long-change-in-prod}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

recognition:
  service:
    url: ${RECOGNITION_SERVICE_URL:http://localhost:8090}
    timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.smartgym: INFO
    org.springframework.security: WARN

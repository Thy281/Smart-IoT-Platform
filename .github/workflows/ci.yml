name: CI

on:
  push:
    branches: ["main", "develop", "copilot/**"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  # ── Java API ────────────────────────────────────────────────
  api-build:
    name: "Build & Test – smartgym-api"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartgym_test
          POSTGRES_USER: smartgym
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and test
        working-directory: apps/smartgym-api
        run: ./mvnw --no-transfer-progress verify
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: smartgym_test
          DB_USER: smartgym
          DB_PASSWORD: changeme
          JWT_SECRET: ci-secret-at-least-32-chars-long-ok

  # ── Python Recognition Service ──────────────────────────────
  recognition-test:
    name: "Test – recognition-service"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/recognition-service/requirements.txt

      - name: Install dependencies
        working-directory: apps/recognition-service
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: apps/recognition-service
        run: pytest tests/ -v
